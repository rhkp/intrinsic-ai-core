# This project was developed with assistance from AI tools.
name: Canonical OpenShift configuration
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: openshift/deployment/chartassignment-controller/go.mod
          cache-dependency-path: openshift/deployment/chartassignment-controller/go.sum
      - name: Install pinned validation dependencies
        run: make setup-validation
      - name: Run the same offline checks as contributors
        run: make validate
