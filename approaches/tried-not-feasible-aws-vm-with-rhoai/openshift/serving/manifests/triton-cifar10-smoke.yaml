apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: triton-cifar10-smoke
  namespace: arhkp-intrinsic
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    tolerations:
      - key: g5-gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
    model:
      modelFormat:
        name: triton
        version: "2"
      protocolVersion: v2
      runtime: triton-kserve-rest
      storageUri: gs://kfserving-examples/models/torchscript
