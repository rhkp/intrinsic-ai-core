apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chartassignments.apps.cloudrobotics.com
spec:
  group: apps.cloudrobotics.com
  scope: Namespaced
  names:
    kind: ChartAssignment
    plural: chartassignments
    singular: chartassignment
    shortNames: [ca]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Generation
          type: integer
          jsonPath: .status.observedGeneration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clusterName:
                  type: string
                namespaceName:
                  type: string
                chart:
                  type: object
                  properties:
                    repository:
                      type: string
                    name:
                      type: string
                    version:
                      type: string
                    inline:
                      type: string
                    values:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastUpdateTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      status:
                        type: string
                      type:
                        type: string
                      message:
                        type: string
                phase:
                  type: string
