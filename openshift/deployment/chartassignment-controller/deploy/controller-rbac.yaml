apiVersion: v1
kind: ServiceAccount
metadata:
  name: chartassignment-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chartassignment-controller
rules:
  - apiGroups: [apps.cloudrobotics.com]
    resources: [chartassignments]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [apps.cloudrobotics.com]
    resources: [chartassignments/status]
    verbs: [get, update, patch]
  - apiGroups: [apps.cloudrobotics.com]
    resources: [chartassignments/finalizers]
    verbs: [update, patch]
  - apiGroups: [apps.cloudrobotics.com]
    resources: [resourcesets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [apps.cloudrobotics.com]
    resources: [resourcesets/finalizers]
    verbs: [update, patch]
  - apiGroups: [events.k8s.io, ""]
    resources: [events]
    verbs: [create, patch, update]
  # Project-scoped workload resources. Secret access is intentionally absent;
  # runtime credentials are created out of band as reviewed Opaque Secrets.
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # VirtualServices are namespace-scoped and rewritten to the approved mesh
  # ingress Gateway before the controller applies them.
  - apiGroups: [networking.istio.io]
    resources: [virtualservices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chartassignment-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chartassignment-controller
subjects:
  - kind: ServiceAccount
    name: chartassignment-controller
    namespace: arhkp-intrinsic
