apiVersion: v1
kind: ServiceAccount
metadata:
  name: omts-deployer
  namespace: arhkp-intrinsic
  labels:
    app.kubernetes.io/name: intrinsic-omts-deployer
    app.kubernetes.io/part-of: intrinsic-openshift-demo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omts-deployer-image-push
  namespace: arhkp-intrinsic
  labels:
    app.kubernetes.io/name: intrinsic-omts-deployer
    app.kubernetes.io/part-of: intrinsic-openshift-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: omts-deployer
    namespace: arhkp-intrinsic
