apiVersion: apps/v1
kind: Deployment
metadata:
  name: proto-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proto-builder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: proto-builder
    spec:
      automountServiceAccountToken: false
      containers:
        - name: proto-builder
          image: {{ .Values.registry }}{{ .Values.images.proto_builder }}
          args:
            - /intrinsic_runtime/intrinsic/proto_tools/builder/proto_builder
            - --service_port=8080
          securityContext:
            readOnlyRootFilesystem: true
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: proto-builder
  labels:
    app: proto-builder
spec:
  clusterIP: None
  ports:
    - port: 8080
      name: grpc-proto-builder
  selector:
    app: proto-builder
  type: ClusterIP
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: proto-builder
spec:
  hosts:
    - "*"
  gateways:
    - app-ingress/gateway
  http:
    - match:
        - uri:
            prefix: /intrinsic_proto.executive.ProtoBuilder/
      route:
        - destination:
            host: proto-builder
            port:
              number: 8080
