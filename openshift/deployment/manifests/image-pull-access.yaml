apiVersion: v1
kind: ServiceAccount
metadata:
  name: intrinsic-runtime
  namespace: your-project-namespace
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intrinsic-runtime-image-pull
  namespace: your-project-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: intrinsic-runtime
    namespace: your-project-namespace
  - kind: ServiceAccount
    name: chartassignment-controller
    namespace: your-project-namespace
  - kind: ServiceAccount
    name: resource-registry
    namespace: your-project-namespace
  - kind: ServiceAccount
    name: skill-registry
    namespace: your-project-namespace
  - kind: ServiceAccount
    name: workcell-cluster-service
    namespace: your-project-namespace
  - kind: ServiceAccount
    name: zenoh-router-sa
    namespace: your-project-namespace
