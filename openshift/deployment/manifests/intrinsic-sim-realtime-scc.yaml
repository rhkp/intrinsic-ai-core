apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: intrinsic-sim-realtime
  annotations:
    kubernetes.io/description: >-
      Restricted, non-privileged SCC for the dedicated Intrinsic simulator
      ServiceAccount. Drops all capabilities unless the exact UR/ICON main
      container requests IPC_LOCK and ICON also requests SYS_NICE.
priority: 12
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - IPC_LOCK
  - SYS_NICE
  - NET_BIND_SERVICE
fsGroup:
  type: MustRunAs
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:arhkp-intrinsic:intrinsic-sim-realtime
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
